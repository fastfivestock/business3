<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>패스트파이브 재고체크</title>
</head>
<body style="margin:0;background:#eef2f6;font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif">
<p id="msg" style="padding:24px;color:#5a6a7e">불러오는 중…</p>
<script>
  // 화면은 구글 시트에 연결된 웹앱에서 받아 와요. 구글 로그인과 상관없이 열려요.
  var API = 'https://script.google.com/macros/s/AKfycbxlDjUH-MJo5NhfOqTgTVD5QLYQAgbCBZKzrjoj-F3bocFXvs0kcE9KZyCpnugb_swZfQ/exec';
  fetch(API + '?ui=1&api=' + encodeURIComponent(API), { credentials: 'omit' })
    .then(function (r) { return r.text(); })
    .then(function (h) {
      if (h.indexOf('const BOOT') < 0) throw new Error('bad');
      document.open(); document.write(h); document.close();
    })
    .catch(function () { document.getElementById('msg').textContent = '연결하지 못했어요. 잠시 후 새로고침해 주세요.'; });
</script>
</body>
</html>
